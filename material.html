<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Material - PLN RAB & Monitoring</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header" id="header"></header>
      <main class="main-content">
        <div class="card">
          <div class="card-body">
            <div class="toolbar">
              <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" placeholder="Cari material...">
              </div>
              <button class="btn btn-primary"><i data-lucide="plus"></i> Tambah Material</button>
            </div>
            
            <div class="table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>KODE</th>
                    <th>URAIAN</th>
                    <th>SATUAN</th>
                    <th class="text-right">HARGA MATERIAL</th>
                    <th class="text-right">HARGA JASA</th>
                  </tr>
                </thead>
                <tbody id="materialTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Components.init('material')) return;
      Utils.showLoading();
      const res = await API.getData('HSMaterial');
      const tbody = document.getElementById('materialTbody');
      if(res.success && res.data.length > 0) {
        tbody.innerHTML = res.data.map(d => `
          <tr>
            <td>${d.kode}</td>
            <td>${d.uraian}</td>
            <td>${d.satuan}</td>
            <td class="text-right">${Utils.formatCurrency(d.harga_material)}</td>
            <td class="text-right">${Utils.formatCurrency(d.harga_jasa)}</td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center p-20">Belum ada data material</td></tr>';
      }
      Utils.hideLoading();
    });
  </script>
</body>
</html>
